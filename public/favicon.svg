<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F141C"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="gloveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#F97316" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Impact Sparks / Burst -->
  <path d="M32 8 L35 20 L46 14 L39 24 L52 28 L40 33 L48 44 L36 38 L32 52 L28 38 L16 44 L24 33 L12 28 L25 24 L18 14 L29 20 Z" 
        fill="url(#flameGrad)" opacity="0.45" filter="url(#glow)"/>

  <!-- Flaming Fist & KO Strike Icon -->
  <g transform="translate(13, 13)">
    <!-- Back Flame -->
    <path d="M19 2 C23 7, 28 11, 27 19 C26 26, 20 31, 14 31 C8 31, 3 26, 3 19 C3 12, 10 7, 12 3 C13 7, 15 9, 17 8 Z" fill="url(#flameGrad)"/>
    <!-- Glove Silhouette -->
    <path d="M14 12 C18 12 23 14 24 18 C25 22 23 27 19 29 C17 30 13 30 10 29 C7 27 5 22 6 18 C7 14 11 12 14 12 Z" fill="url(#gloveGrad)"/>
    <path d="M8 24 L10 32 L18 32 L19 25 Z" fill="#7F1D1D"/>
    <path d="M9 29 L19 29" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Small impact star -->
    <circle cx="24" cy="14" r="2.5" fill="#FFFFFF"/>
    <circle cx="24" cy="14" r="1.5" fill="#FEF08A"/>
  </g>
</svg>
